<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Light Control</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --muted: #71717a;
    --red: #ef4444;
    --amber: #f59e0b;
    --green: #22c55e;
    --red-glow: rgba(239,68,68,.4);
    --amber-glow: rgba(245,158,11,.4);
    --green-glow: rgba(34,197,94,.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  .header { padding: 24px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header-links a { color: var(--muted); text-decoration: none; font-size: 13px; margin-left: 16px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; transition: all .2s; }
  .header-links a:hover { color: var(--text); border-color: var(--muted); }

  .main { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 73px); }

  /* Left panel: traffic light */
  .light-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--border); padding: 32px; gap: 24px; }
  .traffic-light { background: #111318; border-radius: 24px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; border: 2px solid var(--border); }
  .bulb { width: 80px; height: 80px; border-radius: 50%; background: #1e2028; border: 2px solid var(--border); transition: all .3s ease; }
  .bulb.active-red    { background: var(--red);   border-color: var(--red);   box-shadow: 0 0 30px var(--red-glow), 0 0 60px var(--red-glow); }
  .bulb.active-amber  { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 30px var(--amber-glow), 0 0 60px var(--amber-glow); }
  .bulb.active-green  { background: var(--green); border-color: var(--green); box-shadow: 0 0 30px var(--green-glow), 0 0 60px var(--green-glow); }

  .status-badge { font-size: 14px; font-weight: 500; padding: 6px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); text-transform: uppercase; letter-spacing: .5px; }
  .ws-indicator { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .ws-dot.disconnected { background: var(--red); }

  /* Right panel: debugger */
  .debug-panel { display: flex; flex-direction: column; overflow: hidden; }
  .debug-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .debug-header h2 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .debug-count { font-size: 12px; color: var(--muted); background: var(--surface); padding: 2px 10px; border-radius: 10px; border: 1px solid var(--border); }
  .debug-log { flex: 1; overflow-y: auto; padding: 8px; }
  .log-entry { margin: 4px 8px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.6; animation: fadeIn .3s ease; }
  .log-entry + .log-entry { margin-top: 4px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .log-time { color: var(--muted); }
  .log-method { font-weight: 700; }
  .log-method.GET { color: var(--green); }
  .log-method.POST { color: var(--amber); }
  .log-status { margin-left: 8px; }
  .log-status.s200 { color: var(--green); }
  .log-status.s400, .log-status.s401 { color: var(--red); }
  .log-detail { color: var(--muted); margin-top: 4px; }
  .log-detail span { color: var(--text); }
  .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <h1>Traffic Light Control</h1>
  <div class="header-links">
    <a href="/docs" target="_blank">API Explorer</a>
  </div>
</div>

<div class="main">
  <div class="light-panel">
    <div class="traffic-light">
      <div class="bulb" id="bulb-red"></div>
      <div class="bulb" id="bulb-amber"></div>
      <div class="bulb" id="bulb-green"></div>
    </div>
    <div class="status-badge" id="status-badge">connecting...</div>
    <div class="ws-indicator">
      <span class="ws-dot" id="ws-dot"></span>
      <span id="ws-label">WebSocket connecting</span>
    </div>
  </div>

  <div class="debug-panel">
    <div class="debug-header">
      <h2>Live API Debugger</h2>
      <span class="debug-count" id="debug-count">0 requests</span>
    </div>
    <div class="debug-log" id="debug-log">
      <div class="empty-state" id="empty-state">Waiting for API requests...</div>
    </div>
  </div>
</div>

<script>
const bulbs = { red: document.getElementById('bulb-red'), amber: document.getElementById('bulb-amber'), green: document.getElementById('bulb-green') };
const badge = document.getElementById('status-badge');
const wsDot = document.getElementById('ws-dot');
const wsLabel = document.getElementById('ws-label');
const debugLog = document.getElementById('debug-log');
const debugCount = document.getElementById('debug-count');
const emptyState = document.getElementById('empty-state');
let count = 0;

function setColor(color) {
  Object.entries(bulbs).forEach(([c, el]) => {
    el.className = 'bulb' + (c === color ? ` active-${c}` : '');
  });
  badge.textContent = color.toUpperCase();
}

function addLogEntry(entry) {
  if (emptyState) emptyState.remove();
  count++;
  debugCount.textContent = `${count} request${count !== 1 ? 's' : ''}`;
  const div = document.createElement('div');
  div.className = 'log-entry';
  const t = new Date(entry.timestamp).toLocaleTimeString();
  let html = `<span class="log-time">${t}</span> <span class="log-method ${entry.method}">${entry.method}</span> ${entry.path} <span class="log-status s${entry.status}">${entry.status}</span>`;
  if (entry.body) html += `<div class="log-detail">Body: <span>${entry.body}</span></div>`;
  html += `<div class="log-detail">Response: <span>${entry.response}</span></div>`;
  div.innerHTML = html;
  debugLog.appendChild(div);
  debugLog.scrollTop = debugLog.scrollHeight;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    wsDot.className = 'ws-dot';
    wsLabel.textContent = 'WebSocket connected';
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'color') setColor(msg.color);
    if (msg.type === 'log') addLogEntry(msg.entry);
    if (msg.type === 'history') msg.entries.forEach(addLogEntry);
  };

  ws.onclose = () => {
    wsDot.className = 'ws-dot disconnected';
    wsLabel.textContent = 'WebSocket disconnected - reconnecting...';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();
}

connect();
</script>
</body>
</html>
